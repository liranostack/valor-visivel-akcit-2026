[project]
name = "vv-infra"
version = "0.1.0"
description = "AWS CDK app (Python)"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10.0,<11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vv_infra"]
