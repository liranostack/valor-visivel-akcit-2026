who: >-
  Consultora de RH que monta processos de recrutamento para pequenas empresas de 10 a 50
  funcionários; ex-gerente de RH de uma rede de supermercados.
style: Objetiva, frases completas, usa jargão de RH ("fit cultural", "assertividade").
onboarding:
  business_type: consultoria de RH
  business_structure: ME
  offer: Recrutamento e seleção para pequenas empresas
  audience: Donos de pequenas empresas
  channels: [LinkedIn, Indicação]
  goal: Fechar contratos maiores
  perceived_difficulty: O cliente acha que consegue contratar sozinho
  difficulty_context: Na primeira reunião
baseline: Oferecemos soluções completas em recrutamento com foco em fit cultural e assertividade.
truths:
  - id: dia-na-loja
    kind: hidden
    text: >-
      Antes de abrir a vaga passa meio dia trabalhando ao lado da equipe para entender a rotina real
      da função.
    reveal_when: perguntarem como começou o último processo
  - id: garantia
    kind: hidden
    text: Se o contratado sai em até 90 dias, refaz o processo sem cobrar.
    reveal_when: perguntarem o que acontece se a contratação não der certo
  - id: recusa-salario
    kind: hidden
    text: Recusa vaga com salário abaixo do mercado e explica com dados por quê.
    reveal_when: perguntarem o que ela recusa
  - id: rotatividade
    kind: external
    text: Um dono de padaria disse que "pela primeira vez o caixa durou mais de um ano".
    reveal_when: perguntarem o que clientes disseram depois
  - id: sem-curriculo
    kind: external
    text: Um cliente comentou que ela foi a única que não mandou uma pilha de currículos, mandou três.
    reveal_when: perguntarem o que surpreendeu um cliente
  - id: prazo
    kind: routine
    text: Cada processo leva de 3 a 4 semanas.
  - id: sozinho
    kind: contradiction
    text: Diz que clientes acham que contratam sozinhos, mas quase todos voltam para a segunda vaga.
behavior:
  confidence: high
  verbosity: medium
  confusion: 0.1
  irritation: 0.3
vague_answers: 2
scripted_answers:
  - seguimos nossa metodologia própria com foco em fit cultural
  - fazemos um levantamento de perfil completo junto ao cliente
  - antes de abrir a vaga eu passo meio dia trabalhando junto com a equipe para ver a rotina real
  - um dono de padaria me disse que pela primeira vez o caixa durou mais de um ano
