who: >-
  Boleira que faz bolos de casamento e aniversário em cozinha de casa adaptada, há 6 anos, sozinha
  com a ajuda da irmã nos fins de semana.
style: Animada, usa diminutivos e emoji em texto ("bolinho", ":)"), conta histórias longas.
onboarding:
  business_type: confeitaria
  business_structure: MEI
  offer: Bolos de casamento
  audience: Noivas
  channels: [Instagram, WhatsApp]
  goal: Cobrar mais pelos bolos
  perceived_difficulty: Noivas acham caro
  difficulty_context: Quando mando o orçamento
baseline: Faço bolos lindos e deliciosos, com muito amor e ingredientes de qualidade.
truths:
  - id: degustacao
    kind: hidden
    text: >-
      Faz degustação só com a noiva e a mãe, e pergunta qual bolo marcou a infância delas; já
      recriou o bolo de uma avó.
    reveal_when: perguntarem como foi a última degustação
  - id: confirma-escrito
    kind: hidden
    text: Confirma por escrito, uma semana antes, sabor, tamanho, horário e quem recebe no salão.
    reveal_when: perguntarem o que ela confere antes da entrega
  - id: recusa-prazo
    kind: hidden
    text: Não aceita casamento com menos de 30 dias porque uma vez aceitou e o andar desabou no transporte.
    reveal_when: perguntarem o que ela recusa
  - id: cerimonialista
    kind: external
    text: Uma cerimonialista indica porque "com ela eu não preciso ligar no dia, chega e monta sozinha".
    reveal_when: perguntarem quem indica e por quê
  - id: sabor-avo
    kind: external
    text: Uma noiva chorou na festa porque o bolo tinha o gosto do bolo da avó.
    reveal_when: perguntarem o que a noiva disse depois
  - id: volume
    kind: routine
    text: Faz no máximo dois casamentos por fim de semana.
  - id: caro
    kind: contradiction
    text: Diz que noivas acham caro, mas não lembra de ter perdido noiva depois da degustação.
behavior:
  confidence: medium
  verbosity: long
  digression: 0.4
  confusion: 0.1
vague_answers: 2
scripted_answers:
  - ah foi lindo, fiz com muito amor como sempre :)
  - eu capricho em tudo, a noiva fica encantada
  - na degustação eu pergunto qual bolo marcou a infância delas, já refiz até o bolo de uma avó
  - a cerimonialista me indica porque diz que comigo ela não precisa ligar no dia
