[project]
name = "vv-it"
version = "0.1.0"
description = "Simulated clients, scenarios and LLM-as-judge"
requires-python = ">=3.12"
dependencies = [
    "vv-contracts",
    "vv-chat",
    "vv-mcp",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vv_it"]

[tool.uv.sources]
vv-contracts = { workspace = true }
vv-chat = { workspace = true }
vv-mcp = { workspace = true }
