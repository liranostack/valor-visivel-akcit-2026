[project]
name = "vv-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vv_contracts"]
